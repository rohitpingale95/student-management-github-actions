name: CI/CD using Github Actions

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout-code
        uses: actions/checkout@v5

      -  name: setup java
         uses: actions/setup-java@v5
         with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Application
        uses: mvn clean package

      - name: Build Application
        uses: mvn clean package

        
